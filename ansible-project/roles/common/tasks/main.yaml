---
- name: Update apt software package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install mandatory system utilities
  apt:
    name:
      - curl
      - git
      - htop
      - ufw
    state: present

- name: Allow SSH connections through UFW
  ufw:
    rule: allow
    name: OpenSSH
    state: enabled

- name: Enable UFW firewall securely
  ufw:
    state: enabled
    policy: deny

- name: Trigger system logging verification
  notify: restart common logging service