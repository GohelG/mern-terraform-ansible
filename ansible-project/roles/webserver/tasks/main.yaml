---
- name: Create base directory for target applications
  file:
    path: /var/www/app
    state: directory
    owner: azureuser
    group: azureuser
    mode: '0755'

- name: Provision secure backend production variables
  template:
    src: backend_env.j2
    dest: /var/www/app/.backend.env
    owner: azureuser
    group: azureuser
    mode: '0600'

- name: Provision public frontend routing parameters
  template:
    src: frontend_env.j2
    dest: /var/www/app/.frontend.env
    owner: azureuser
    group: azureuser
    mode: '0644'

- name: Install Nginx reverse proxy server
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Open HTTP and HTTPS router ports via UFW
  ufw:
    rule: allow
    name: 'Nginx Full'

- name: Deploy application systemd service unit
  template:
    src: node_app.service.j2
    dest: /etc/systemd/system/node_app.service
    owner: azureuser
    group: azureuser
    mode: '0644'
  notify: reload systemd daemon

- name: Ensure runtime application process is enabled and running
  service:
    name: node_app
    state: started
    enabled: yes

- name: Populate production Nginx virtual host layout
  template:
    src: nginx_vhost.j2
    dest: /etc/nginx/sites-available/node_app
    owner: azureuser
    group: azureuser
    mode: '0644'
  notify: restart nginx service

- name: Enable Nginx virtual host configuration symlink
  file:
    src: /etc/nginx/sites-available/node_app
    dest: /etc/nginx/sites-enabled/node_app
    state: link
  notify: restart nginx service

- name: Sever standard default Nginx configuration symlink
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx service