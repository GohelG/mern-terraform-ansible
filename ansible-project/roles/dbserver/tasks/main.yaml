---
- name: Install repository key distribution dependency
  apt:
    name: gnupg
    state: present

- name: Fetch and import official MongoDB GPG key
  apt_key:
    url: https://mongodb.org
    state: present

- name: Add official MongoDB repository source entry
  apt_repository:
    repo: "deb [ arch=amd64,arm64 ] https://mongodb.org {{ ansible_distribution_release }}/mongodb-org/7.0 multiverse"
    state: present

- name: Install official MongoDB server packages
  apt:
    name: mongodb-org
    state: present
    update_cache: yes

- name: Configure MongoDB via configuration template
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart mongodb service

- name: Permit database access explicitly from web nodes
  ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "{{ mongo_port }}"
    proto: tcp
  loop:
    - 10.0.1.4
    - 40.114.25.163